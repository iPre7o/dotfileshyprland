# Lista de apps "single instance" que o app-guard.sh deve proteger.
# Formato: nome-do-arquivo.desktop | regex-da-classe-da-janela | wrapper-opcional
#
# O 3o campo (wrapper-opcional) e o nome de um script dentro de
# ~/.config/waybar/scripts/ que roda ANTES do comando real (ex:
# nvidia-offload.sh, pra forcar o app a usar a GPU dedicada). Pode deixar
# em branco na maioria dos casos.
#
# Pra achar a classe de um app ja aberto: hyprctl clients -j | grep class
#
# Depois de editar, rode: ~/.config/waybar/scripts/generate-guards.sh

# NAO adicione "nvidia-offload.sh" na linha do steam ate confirmar que
# `nvidia-smi` funciona (driver da NVIDIA instalado e carregado) - veja
# ~/Documentos/waybar-single-instance-apps.md, secao GPU NVIDIA.
steam.desktop                     | ^(steam)$
vesktop.desktop                   | ^(vesktop|discord)$
spotify.desktop                   | ^([Ss]potify)$
slack.desktop                     | ^([Ss]lack)$
org.telegram.desktop.desktop      | ^([Tt]elegram[Dd]esktop|org\.telegram\.desktop)$
signal-desktop.desktop            | ^([Ss]ignal)$
com.obsproject.Studio.desktop     | ^([Oo][Bb][Ss].*)$
thunderbird.desktop               | ^([Tt]hunderbird|[Mm]ail)$
org.keepassxc.KeePassXC.desktop   | ^([Kk]eepassxc)$

# Os nomes de arquivo/classe acima variam por distro e forma de instalacao
# (pacote oficial, AUR, flatpak). Se o generate-guards.sh avisar que nao
# encontrou o .desktop, ou se o guard nao detectar o app aberto, veja
# ~/Documentos/waybar-single-instance-apps.md para descobrir o nome certo
# e corrigir a linha.
